# Port 80: only for Let's Encrypt renewals + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name headers.interlinked.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: TLS with the Let's Encrypt cert, then forward to whoami
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name headers.interlinked.dev;

    ssl_certificate     /etc/letsencrypt/live/headers.interlinked.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/headers.interlinked.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}